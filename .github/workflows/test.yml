# CI for a PUBLIC repo. Two constraints shape every job here, and both are hard:
#
#  1. A public repo cannot call a reusable workflow from a private one. The `e2e` job that
#     lived here called durantic/e2e's run.yml, which made the whole file fail to compile the
#     day this repo went public (93e31d1) -- every run since produced zero jobs. The terraform
#     suite now runs from the e2e repo side, which can check this repo out because it is public.
#  2. Org secrets with `visibility=private` do not reach this repo at all. That is every
#     E2E_TEST_API_TOKEN_*, E2E_CHECKOUT_TOKEN, and all four API_BASE_*, so the acceptance-test
#     matrix against a live control plane cannot run here either -- its endpoint was always ''.
#
# What is left is everything hermetic, plus the one org secret pair that is `visibility=all`
# (GITOPS_APP_CLIENTID / GITOPS_APP_KEY) used to fetch the private controlplane-client-go
# module. That auth block is copied verbatim from release.yml, which passes.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Every job needs the private Go module, so no job can run for a fork PR: the App-token step
  # gets empty secrets and fails with an auth error that looks like a code problem. Skip
  # explicitly instead, so an external contributor sees "skipped", not a misleading red X.
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - run: go mod download
      # go.sum kept stale entries for a replaced dependency version through several bumps,
      # because nothing checked. Tidy is cheap and the drift is invisible otherwise.
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit"
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^tools/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -s reports these files need formatting; run 'make fmt'"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...
      # Acceptance tests self-skip unless TF_ACC is set, so this is the hermetic unit slice.
      - name: Unit tests
        run: make test

      # No consumer in this workflow -- kept so a PR carries a downloadable binary for manual
      # checks and for an e2e run dispatched from the private side.
      - name: Build provider binary
        run: go build -o terraform-provider-durantic .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: terraform-provider-binary
          path: terraform-provider-durantic
          retention-days: 5

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v9.1.0
        with:
          version: v2.13.2

  docs:
    name: Registry docs are current
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      # docs/ is what the Terraform Registry publishes, so drift here is user-visible.
      - run: make generate
      - name: Check for uncommitted docs changes
        run: |
          if ! git diff --exit-code --stat -- docs/; then
            echo "::error::docs/ is stale; run 'make generate' and commit the result"
            exit 1
          fi
