# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  # Manual build + full test (incl. provisioning e2e) from any branch via the
  # "Run workflow" dropdown.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
  # No branch-push trigger besides main: pull_request already covers feature
  # branches, and an unfiltered push trigger double-runs every PR commit.
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'

# One pipeline at a time per ref (same pattern as agent ci.yml): a new commit
# cancels the superseded in-progress run of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOPRIVATE: github.com/durantic/*
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v9.1.0
        with:
          version: latest
      # Binary for the provisioning e2e job below; dev_overrides requires the
      # terraform-provider-durantic file name.
      - name: Build provider binary for e2e
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/terraform-provider-durantic .
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-binary
          path: dist/terraform-provider-durantic
          retention-days: 1
          if-no-files-found: error

  generate:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/durantic/*
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/durantic/*
    strategy:
      fail-fast: false
      max-parallel: 1 # Avoid a race condition
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - '1.13.*'
          - '1.14.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - env:
          TF_ACC: "1"
          DURANTIC_API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN_STAGE }}
          DURANTIC_ENDPOINT: ${{ vars.API_BASE_STAGE }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10

  # Tier 3 provisioning e2e: hand the binary built above to the reusable e2e
  # workflow, which boots a QEMU VM on the self-hosted runner and provisions
  # it via durantic_machine_deployment against staging (suite: terraform in
  # durantic/e2e), using the same org-level stage endpoint/token as the
  # acceptance tests above. Gated to PRs, main, tags, and manual dispatch so
  # plain feature-branch pushes (which already run as part of their PR) don't
  # boot VMs twice.
  e2e:
    name: Provisioning e2e (stage)
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    # TODO(DUR-196): switch the ref to @main once durantic/e2e branch
    # DUR-196/terraform-e2e-suite is merged (main lacks provider_artifact).
    uses: durantic/e2e/.github/workflows/run.yml@DUR-196/terraform-e2e-suite
    with:
      environment: stage
      suite: terraform
      provider_artifact: terraform-provider-binary
      controlplane_api: ${{ vars.API_BASE_STAGE }}
      # TODO(DUR-196): drop this ref override together with the @main switch
      # above — the checkout inside run.yml defaults to e2e main for callers.
      ref: DUR-196/terraform-e2e-suite
    secrets:
      API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN_STAGE }}
      CHECKOUT_TOKEN: ${{ secrets.E2E_CHECKOUT_TOKEN }}
