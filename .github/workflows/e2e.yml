# Provisioning e2e (Tier 3): build the provider from this ref, hand the binary
# to the reusable e2e workflow, which boots a QEMU VM and provisions it via
# durantic_machine_deployment against dev01. See README "Tier 3" and DUR-196.
name: E2E

on:
  workflow_dispatch:
  push:
    # TODO(DUR-196): remove the feature branch before merging — it exists only
    # because workflow_dispatch needs the workflow on the default branch.
    branches: [main, DUR-196/terraform-e2e-suite]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-provider:
    name: Build provider binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPRIVATE: github.com/durantic/*
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENTID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          repositories: controlplane-client-go
      - name: Configure git for private Go modules
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - name: Build linux/amd64 provider binary
        # dev_overrides requires the terraform-provider-durantic file name
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/terraform-provider-durantic .
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-binary
          path: dist/terraform-provider-durantic
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Provisioning e2e (dev01)
    needs: build-provider
    # TODO(DUR-196): switch the ref to @main once durantic/e2e branch
    # DUR-196/terraform-e2e-suite is merged (main lacks provider_artifact).
    uses: durantic/e2e/.github/workflows/run.yml@DUR-196/terraform-e2e-suite
    with:
      environment: dev01
      suite: terraform
      provider_artifact: terraform-provider-binary
    secrets:
      API_TOKEN: ${{ secrets.E2E_TEST_API_TOKEN_DEV }}
      CHECKOUT_TOKEN: ${{ secrets.E2E_CHECKOUT_TOKEN }}
